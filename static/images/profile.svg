<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bg-grad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="188" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.6" stroke-dasharray="10 6" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Geometric Tech Grid Accents -->
  <path d="M 50 200 H 110 M 290 200 H 350" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <path d="M 200 50 V 110 M 200 290 V 350" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

  <!-- Central Avatar Silhouette / Tech Badge -->
  <g transform="translate(100, 75)">
    <!-- Head -->
    <circle cx="100" cy="70" r="48" fill="url(#accent-grad)" filter="url(#glow)"/>
    <circle cx="100" cy="70" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Code Symbol in Head -->
    <text x="100" y="78" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;MAG/&gt;</text>
    
    <!-- Shoulders / Torso -->
    <path d="M 30 185 C 30 135, 60 120, 100 120 C 140 120, 170 135, 170 185 Z" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="2.5"/>
    <path d="M 55 185 C 55 150, 75 138, 100 138 C 125 138, 145 150, 145 185 Z" fill="#0f172a" opacity="0.8"/>
  </g>

  <!-- Floating Status Node -->
  <g transform="translate(250, 270)">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="18" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">AVAILABLE</text>
  </g>
</svg>
