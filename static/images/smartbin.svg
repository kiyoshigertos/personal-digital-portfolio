<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="eco-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021a14"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#eco-bg)"/>

  <!-- IoT Signals Waves -->
  <g stroke="#34d399" fill="none" opacity="0.3" stroke-width="2">
    <circle cx="300" cy="170" r="140" stroke-dasharray="10 10"/>
    <circle cx="300" cy="170" r="170" stroke-dasharray="15 15"/>
  </g>

  <!-- Smart Bin Body -->
  <g transform="translate(230, 80)">
    <!-- Lid / Sensor Top -->
    <path d="M 20 40 L 120 40 L 110 25 L 30 25 Z" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <rect x="55" y="15" width="30" height="10" rx="3" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    
    <!-- Sensor Pulse Indicator -->
    <circle cx="70" cy="20" r="3" fill="#a7f3d0" filter="url(#green-glow)"/>

    <!-- Bin Container -->
    <path d="M 25 45 L 35 180 L 105 180 L 115 45 Z" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <line x1="45" y1="65" x2="95" y2="65" stroke="#047857" stroke-width="2"/>
    <line x1="47" y1="95" x2="93" y2="95" stroke="#047857" stroke-width="2"/>
    <line x1="49" y1="125" x2="91" y2="125" stroke="#047857" stroke-width="2"/>

    <!-- Fill Level Indicator (Simulated Level Bar) -->
    <rect x="50" y="80" width="40" height="85" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <rect x="53" y="115" width="34" height="47" rx="2" fill="url(#emerald-glow)"/>
    
    <!-- Recycle Icon -->
    <g transform="translate(62, 50) scale(0.6)" stroke="#34d399" stroke-width="2" fill="none">
      <path d="M 12 2 L 20 16 L 4 16 Z"/>
      <circle cx="12" cy="11" r="2" fill="#34d399"/>
    </g>
  </g>

  <!-- Title & Description -->
  <text x="300" y="285" fill="#f0fdf4" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Smart Bin — IoT Waste Management</text>
  <text x="300" y="310" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Automated Fill-Level Monitoring &amp; Environmental Sustainability</text>

  <!-- Tag badge -->
  <g transform="translate(200, 335)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="100" y="17" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">IoT &amp; Hardware Concept</text>
  </g>
</svg>
